name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazelisk
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build rules
        run: bazel build //...

      - name: Run analysis tests
        run: bazel test //bitcode/tests:all

      - name: Build examples
        run: cd examples && bazel build //...

  bitcode:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazelisk
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build diamond bitcode
        run: cd examples && bazel build //:diamond_bc

      - name: Assert laziness, content, dedup, skips
        run: cd examples && BAZEL=bazel ./tests/bitcode_test.sh
