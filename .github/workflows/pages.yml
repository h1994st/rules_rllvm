name: Pages

# Path filters are safe here in a way they would not be in `ci.yml`: this
# workflow is not a required status check, so a pull request that never runs it
# is still mergeable.
#
# The release-please manifest is in the list because the hero's `bazel_dep`
# line and the version in the header are read from it. Without it a release
# would leave the published page advertising the previous version. It changes
# only when a release lands, which is why it is here and MODULE.bazel is not:
# that file also carries every dependency, and a dependency bump changes
# nothing on the page.
on:
  push:
    branches: ["main"]
    paths: ["README.md", ".release-please-manifest.json", "site/**", ".github/workflows/pages.yml"]
  pull_request:
    branches: ["main"]
    paths: ["README.md", ".release-please-manifest.json", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment in flight; a half-published site is worse than a
# slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate index from README
        run: python3 site/build.py

      # `actions/configure-pages` is deliberately absent: its only job here
      # would be to infer `baseurl`, which `_config.yml` sets outright, and it
      # fails on pull requests before Pages has been enabled.
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
        env:
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    name: Deploy site
    # Pull requests build the site to catch a README change that breaks it,
    # but only `main` publishes.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
